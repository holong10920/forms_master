# uv workspace root (virtual: no [project] table). Python packages live in python/*.
[tool.uv]
required-version = ">=0.13.5"

[tool.uv.workspace]
members = ["python/*"]

[dependency-groups]
dev = [
  "fb-contracts",
  "fb-store",
  "import-linter==2.15",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-socket==0.8.1",
  "ruff==0.17.2",
  "types-jsonschema==4.26.0.20261006",
]

[tool.uv.sources]
fb-contracts = { workspace = true }
fb-store = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["python"]
# Tests must never reach the network (S0 security boundary).
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["python/fb_contracts/src", "python/fb_store/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may run the current interpreter with fixed scripts and seed non-crypto RNGs.
"**/tests/**" = ["S101", "S311", "S603"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["python"]
explicit_package_bases = true
mypy_path = ["python/fb_contracts/src", "python/fb_store/src"]

[tool.importlinter]
root_packages = ["fb_store", "fb_contracts"]

[[tool.importlinter.contracts]]
name = "Store depends on contracts, never the reverse"
type = "layers"
layers = ["fb_store", "fb_contracts"]
